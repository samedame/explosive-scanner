name: forward-scorecard
on:
  schedule:
    - cron: '0 15 * * 6'        # Saturdays 15:00 UTC
  workflow_dispatch:
permissions:
  contents: write
concurrency: daily-scan
jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - run: pip install -r requirements.txt
      - env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m scanner.score
      - run: |
          git config user.name "explosive-scanner[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add state data
          git diff --cached --quiet || (git commit -m "scorecard $(date -u +%F)" && git pull --rebase -q && git push)
