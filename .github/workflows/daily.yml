name: daily-scan
on:
  schedule:
    - cron: '30 22 * * 1-5'     # 22:30 UTC = after the US close in both EST and EDT
  workflow_dispatch:
permissions:
  contents: write
concurrency: daily-scan
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - run: pip install -r requirements.txt
      - name: Run scan
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}   # your email; SEC requires a declared contact. Optional: without it SEC tags are skipped
        run: python -m scanner.run_daily
      - name: Commit state, snapshots and alert log
        run: |
          git config user.name "explosive-scanner[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add state data
          git diff --cached --quiet || (git commit -m "scan $(date -u +%F)" && git pull --rebase -q && git push)
